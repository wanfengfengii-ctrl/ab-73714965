name: cable-fault-locator

services:
  api:
    build: ./api
    image: cable-locator-api
    ports:
      # 宿主端口可通过环境变量 API_PORT 配置
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    image: cable-locator-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主端口可通过环境变量 WEB_PORT 配置
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性校验服务：依赖就绪后执行 代码测试 + 前端构建 + 定位 API 冒烟，
  # 结果以退出码给出。用法见 README（--profile verify）。
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: cable-locator-verify
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_BASE: http://api:8000
      WEB_BASE: http://web
    restart: "no"
