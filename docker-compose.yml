name: cable-locator

services:
  api:
    build: ./api
    image: cable-locator-api
    environment:
      API_PORT: "8000"
    ports:
      # 宿主机端口可通过 API_HOST_PORT 配置（默认 8000）
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  web:
    build: ./web
    image: cable-locator-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主机端口可通过 WEB_HOST_PORT 配置（默认 8080）
      - "${WEB_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  # 一次性验证服务：依赖就绪后执行 代码测试 + 前端构建 + 定位 API 冒烟，
  # 以退出码给出结果（docker compose up --exit-code-from verify）。
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: cable-locator-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
    restart: "no"
